# TLS for the console and the API. Run it alongside the production stack:
#
#   docker compose -f deploy/production/compose.yaml \
#                  -f deploy/production/tls.yaml up -d
#
# It publishes 443 only. Port 80 is Traefik's — that is your tenant ingress —
# so Caddy obtains certificates over the TLS-ALPN-01 challenge, which runs on
# 443. Publishing 80 here instead would take the port your deployed stacks are
# served on, which is the sort of outage that looks like a platform bug.
#
# Point both names at this host before starting it, or the first certificate
# request fails and Caddy backs off:
#
#   A  navarch.example.com      -> your static IP
#   A  api.navarch.example.com  -> your static IP

services:
  tls:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      controlplane:
        condition: service_healthy
    environment:
      NAVARCH_DOMAIN: ${NAVARCH_DOMAIN:?set NAVARCH_DOMAIN in .env}
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "443:443"

volumes:
  caddy-data:
  caddy-config:
