# Navarch on a single host.
#
# This is the whole control plane: Postgres, migrations, the API, the router,
# and one node agent on the same box. It is what you would put on a small VM —
# a Lightsail instance, a Hetzner box, an EC2 t4g — to run your own stacks.
#
# It differs from the repository's dev compose.yaml in four ways that matter,
# and each is a thing the dev stack does deliberately that production must not:
#
#   1. Images are pulled by tag, not built. A host that builds its own control
#      plane cannot tell you what it is running.
#   2. Secrets come from the environment (a .env file beside this one), never
#      from literals in the file. `docker compose config` prints this file.
#   3. The agent drives the host's own Docker daemon over a mounted socket.
#      The dev stack uses Docker-in-Docker to fake a fleet; a real single-node
#      install has one real daemon and should use it.
#   4. One component faces the world: Traefik, on 80 and 443, serving your
#      tenants' stacks, the console and the API, with a certificate per
#      hostname. Everything else publishes nothing.
#
# Bring it up:
#   cp deploy/production/env.example deploy/production/.env
#   $EDITOR deploy/production/.env
#   docker compose -f deploy/production/compose.yaml up -d
#
# The .env goes beside this file, not in the repository root. Compose reads it
# from the *project* directory, which a bare `-f deploy/production/compose.yaml`
# sets to this file's directory — verified, and a root .env is ignored even when
# one is sitting there.
#
# Upgrading is pull, migrate, restart, in that order — see deploy/README.md.
# Migrations are immutable and only ever additive, which is what makes that
# sequence safe to run before the new binaries start.

name: navarch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-navarch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Never published. Anything that needs the database is on this network.

  # Runs to completion on every `up`, before the control plane starts. Applying
  # migrations from a one-shot rather than from the API process means an upgrade
  # cannot half-migrate because two replicas raced to do it.
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Relative to THIS file's directory, because that is what Compose makes
      # the project directory when it is selected with a bare
      # `-f deploy/production/compose.yaml`. Written as `./migrations` these
      # resolved to deploy/production/migrations, which does not exist — Docker
      # then creates an empty directory and mounts that, so `migrate up` finds
      # no migrations, exits 0, and the control plane starts against an empty
      # schema. A failure that looks like success is the worst shape available,
      # so the paths are anchored where the documented command actually puts
      # them.
      - ../../migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-navarch}?sslmode=disable"
      - "up"

  controlplane:
    image: ${NAVARCH_IMAGE:-ghcr.io/craigderington/navarch/controlplane}:${NAVARCH_VERSION:?set NAVARCH_VERSION in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      COMPOSECTL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-navarch}?sslmode=disable
      COMPOSECTL_LISTEN_ADDR: 0.0.0.0:8417
      # The shared token now opens only node registration and /metrics. It is
      # still a credential: an attacker holding it can enrol a node.
      COMPOSECTL_AGENT_TOKEN: ${NAVARCH_SERVICE_TOKEN:?set NAVARCH_SERVICE_TOKEN in .env}
      # The first operator. Leave the token unset: the control plane mints one
      # from crypto/rand and logs it exactly once on first boot. Read it with
      # `docker compose logs controlplane | grep bootstrap`, store it, and it
      # will never be printed again.
      COMPOSECTL_BOOTSTRAP_OPERATOR_EMAIL: ${NAVARCH_OPERATOR_EMAIL:?set NAVARCH_OPERATOR_EMAIL in .env}
      COMPOSECTL_ROUTER_DIR: /dynamic
      COMPOSECTL_PREVIEW_DOMAIN: ${NAVARCH_PREVIEW_DOMAIN:-preview.localhost}
      # Every generated tenant route becomes an HTTPS router using this ACME
      # resolver. Leave it unset and routes stay plain HTTP, which is correct
      # for any install whose hostnames do not resolve publicly — ACME cannot
      # succeed there, and failing on every route is worse than no TLS.
      COMPOSECTL_ROUTER_CERT_RESOLVER: ${NAVARCH_CERT_RESOLVER:-le}
      # Preview routes move onto one `*.<preview domain>` certificate when — and
      # only when — a DNS provider is configured below. `:+` is doing real work:
      # one variable turns the whole path on, so the resolver name never has to
      # agree with a second setting somebody could get wrong.
      COMPOSECTL_ROUTER_WILDCARD_RESOLVER: ${NAVARCH_DNS_PROVIDER:+lewild}
      # Where an invited operator lands to redeem. Derived from the domain
      # rather than being a setting of its own, because it is always the console
      # route this same file publishes — and a link built from a request's Host
      # header would be one an attacker could aim.
      COMPOSECTL_CONSOLE_URL: https://console.${NAVARCH_DOMAIN}
    env_file:
      # The Mailgun credential, and nothing else. Optional: without it invites
      # still return a link to paste, failed rollouts are still recorded, and
      # previews still expire on time — nothing is sent, and nothing else
      # changes. See mail.env.example.
      - path: ./mail.env
        required: false
    volumes:
      - traefik-dynamic:/dynamic
    healthcheck:
      test: ["CMD", "/composectl-controlplane", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Deliberately no `ports:`. Traefik fronts it on 443.

  # The only thing that faces the world, and it serves everything: your
  # tenants' stacks, the console and the API.
  #
  # One ingress rather than a proxy in front of another, because Traefik is
  # already the component that knows every hostname the platform serves. That
  # makes it the right place for certificates: it issues for exactly the
  # hostnames it has routers for, so the route list *is* the authorization. A
  # separate proxy would need telling which hostnames are legitimate, kept in
  # step with the route list, and wrong in the dangerous direction whenever it
  # drifted.
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - "--entryPoints.web.address=:80"
      # Plain HTTP redirects to HTTPS. Verified against traefik:v3.3 that this
      # redirect does NOT swallow /.well-known/acme-challenge/ — the challenge
      # is served before routing, so certificates still issue.
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      # Traefik batches provider updates at 2s by default, which is how long a
      # promoted rollout can keep sending traffic to the revision it just
      # superseded. The control plane's teardown grace covers that window; this
      # shortens it. See CLAUDE.md's teardown-grace invariant.
      - "--providers.providersThrottleDuration=100ms"
      # Per-hostname certificates over the HTTP-01 challenge, which needs port
      # 80 — the port this already owns. No wildcard, and therefore no DNS
      # provider credential sitting in the ingress; a customer pointing their
      # own domain here gets a certificate for it like any other route.
      - "--certificatesresolvers.le.acme.email=${NAVARCH_ACME_EMAIL:?set NAVARCH_ACME_EMAIL in .env}"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      # A second resolver, for previews only. Every hostname above costs its own
      # certificate, and a preview hostname is minted per CI run and never seen
      # again — so previews, not tenants, are what reach the CA's per-registered-
      # domain weekly limit first, and reaching it takes the whole install down
      # with them. One wildcard turns an unbounded count into one.
      #
      # DNS-01 because a wildcard cannot be proved over HTTP-01: there is no
      # host to answer on. That is the cost — a credential in the ingress, the
      # thing the resolver above was chosen to avoid — so it is scoped as
      # narrowly as the mechanism allows: it signs only `*.<preview domain>`,
      # and tenant hostnames and customers' own domains stay on HTTP-01 where no
      # credential exists to steal.
      #
      # These flags are always present and inert until something names lewild.
      # Verified against traefik:v3.3 that an empty provider, and a provider with
      # no credentials, both start cleanly — the failure surfaces at issuance,
      # not at boot, which is why the README says to open a preview and look.
      - "--certificatesresolvers.lewild.acme.email=${NAVARCH_ACME_EMAIL}"
      - "--certificatesresolvers.lewild.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.lewild.acme.dnschallenge=true"
      - "--certificatesresolvers.lewild.acme.dnschallenge.provider=${NAVARCH_DNS_PROVIDER:-}"
      - "--log.level=INFO"
    env_file:
      # The DNS credential, and nothing else. Deliberately NOT .env: that file
      # holds the database password and the service token, and handing the whole
      # of it to the one container facing the internet would undo the reason
      # every other service reads only what it needs. Absent is fine — the
      # resolver above simply never succeeds, and nothing names it anyway.
      - path: ./dns.env
        required: false
    environment:
      # Read by the templated platform.yml below.
      NAVARCH_DOMAIN: ${NAVARCH_DOMAIN:?set NAVARCH_DOMAIN in .env}
      # A site that held this host before Navarch. Empty (the default) and
      # platform.yml emits nothing for it at all. See deploy/README.md.
      NAVARCH_COEXIST_DOMAIN: ${NAVARCH_COEXIST_DOMAIN:-}
      NAVARCH_COEXIST_TARGET: ${NAVARCH_COEXIST_TARGET:-}
      NAVARCH_COEXIST_CERT: ${NAVARCH_COEXIST_CERT:-}
      NAVARCH_COEXIST_KEY: ${NAVARCH_COEXIST_KEY:-}
      # Redirect www.<domain> to the apex. Off unless www resolves here; see
      # env.example for why the default is the careful one.
      NAVARCH_WWW_REDIRECT: ${NAVARCH_WWW_REDIRECT:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-dynamic:/dynamic:ro
      # The static routes for the console and the API, alongside the generated
      # tenant routes. Traefik reads the whole directory.
      - ./dynamic/platform.yml:/dynamic/platform.yml:ro
      # Issued certificates. Back this up with pgdata: losing it means every
      # hostname re-issues, and Let's Encrypt rate limits will notice.
      - acme:/acme
      # An incumbent site's existing certificates, read-only, so a cutover
      # serves them from the first request rather than Traefik's self-signed
      # default while ACME catches up. Defaults to a directory that already
      # exists: a bind mount whose source is missing makes Docker create an
      # empty one silently, which is the failure this file was already bitten by
      # once. Point it at /etc/letsencrypt (the whole tree — live/ is symlinks
      # into archive/) when you need it.
      - ${NAVARCH_COEXIST_CERT_DIR:-./dynamic}:/coexist-certs:ro

  # The browser console. A separate service because it is optional: an install
  # that only ever uses the CLI simply does not run it, and the API is not
  # carrying HTML rendering for anybody else.
  #
  # No published port, for the same reason the control plane has none — it
  # holds operator sessions and must sit behind TLS. Traefik terminates for it.
  console:
    image: ${NAVARCH_WEB_IMAGE:-ghcr.io/craigderington/navarch/web}:${NAVARCH_VERSION}
    restart: unless-stopped
    depends_on:
      controlplane:
        condition: service_healthy
    environment:
      # Reached over the compose network, which the transport guard treats as
      # contained — a single-label name resolves nowhere else.
      NAVARCH_URL: http://controlplane:8417
      NAVARCH_WEB_ADDR: 0.0.0.0:8418

  agent:
    image: ${NAVARCH_AGENT_IMAGE:-ghcr.io/craigderington/navarch/agent}:${NAVARCH_VERSION}
    restart: unless-stopped
    depends_on:
      controlplane:
        condition: service_healthy
    environment:
      COMPOSECTL_CONTROLPLANE_URL: http://controlplane:8417
      COMPOSECTL_ORG: ${NAVARCH_ORG:-dev}
      COMPOSECTL_NODE_HOSTNAME: ${NAVARCH_NODE_HOSTNAME:-node-1}
      # What Traefik connects to when routing to this node's containers. On a
      # single host this is the address the agent's containers publish on, which
      # is the host as seen from the compose network.
      COMPOSECTL_ADVERTISE_ADDR: ${NAVARCH_ADVERTISE_ADDR:-172.17.0.1}
      COMPOSECTL_AGENT_TOKEN: ${NAVARCH_SERVICE_TOKEN}
      COMPOSECTL_NODE_LABELS: ingress=true
      COMPOSECTL_NODE_MEMORY_MB: ${NAVARCH_NODE_MEMORY_MB:-3072}
    volumes:
      # The agent drives this host's Docker daemon. This is the one genuinely
      # privileged thing in the file: the socket is root-equivalent, which is
      # why the control plane and the agent are separate processes and only this
      # one gets it.
      - /var/run/docker.sock:/var/run/docker.sock
      # The node's age identity. Secrets are sealed to this key, so losing this
      # volume means every secret must be re-set — back it up with pgdata.
      - age-identity:/identity

volumes:
  pgdata:
  traefik-dynamic:
  age-identity:
  acme:
