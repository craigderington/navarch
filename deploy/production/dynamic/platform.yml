# The platform's own two routes: the console and the API.
#
# Hand-written and static, unlike composectl.yml beside it, which the control
# plane regenerates every tick. Traefik's file provider reads the whole
# directory, so the two coexist without either knowing about the other — which
# is the point: the control plane must never have to write a route it did not
# derive from a live deployment.
#
# `{{env "NAVARCH_DOMAIN"}}` is expanded by Traefik itself: the file provider
# treats dynamic files as Go templates.
#
# Note what is NOT here: the apex. The platform's static routes deliberately
# claim only subdomains, leaving the bare domain for a stack you deploy — a
# marketing site, usually. Two routers with the same Host rule is not an error
# in Traefik, it is an arbitrary winner, so a static route on the apex would
# quietly fight every tenant route the control plane generated for it.
http:
  routers:
    navarch-console:
      rule: Host(`console.{{env "NAVARCH_DOMAIN"}}`)
      entryPoints:
        - websecure
      service: navarch-console
      tls:
        certResolver: le

    navarch-api:
      rule: Host(`api.{{env "NAVARCH_DOMAIN"}}`)
      entryPoints:
        - websecure
      service: navarch-api
      tls:
        certResolver: le

  services:
    navarch-console:
      loadBalancer:
        servers:
          - url: http://console:8418
    navarch-api:
      loadBalancer:
        servers:
          - url: http://controlplane:8417
