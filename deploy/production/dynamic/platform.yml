# The platform's own static routes: the console, the API, and optionally a site
# that held this host before Navarch did.
#
# Hand-written and static, unlike composectl.yml beside it, which the control
# plane regenerates every tick. Traefik's file provider reads the whole
# directory, so the two coexist without either knowing about the other — which
# is the point: the control plane must never have to write a route it did not
# derive from a live deployment.
#
# `{{env "NAVARCH_DOMAIN"}}` is expanded by Traefik itself: the file provider
# treats dynamic files as Go templates.
#
# Note what is NOT here: the apex. The platform's static routes deliberately
# claim only subdomains, leaving the bare domain for a stack you deploy — a
# marketing site, usually. Two routers with the same Host rule is not an error
# in Traefik, it is an arbitrary winner, so a static route on the apex would
# quietly fight every tenant route the control plane generated for it.
http:
  routers:
    navarch-console:
      rule: Host(`console.{{env "NAVARCH_DOMAIN"}}`)
      entryPoints:
        - websecure
      service: navarch-console
      tls:
        certResolver: le

    navarch-api:
      rule: Host(`api.{{env "NAVARCH_DOMAIN"}}`)
      entryPoints:
        - websecure
      service: navarch-api
      tls:
        certResolver: le
{{if env "NAVARCH_WWW_REDIRECT"}}

    # www → the apex, permanently.
    #
    # Gated, and off by default, because this router asks ACME for a
    # certificate for www.<domain> the moment it exists. On an install with no
    # www record that is a validation that fails every retry forever — the exact
    # thing the rest of this deployment is careful not to do. Turn it on only
    # when www actually resolves here.
    #
    # Worth turning on when it does: a name that resolves to this host but has
    # no router gets Traefik's self-signed default, and a certificate warning is
    # a worse answer than NXDOMAIN. A visitor who typed www can read a redirect;
    # they cannot read a browser interstitial.
    navarch-www:
      rule: Host(`www.{{env "NAVARCH_DOMAIN"}}`)
      entryPoints:
        - websecure
      middlewares:
        - navarch-www
      # A router must name a service even when a middleware answers first. This
      # one is never reached: redirectRegex returns 301 before routing.
      service: navarch-api
      tls:
        certResolver: le
{{end}}
{{if env "NAVARCH_COEXIST_DOMAIN"}}

    # A site that held this host before Navarch did.
    #
    # Traefik has to own 80 and 443 — HTTP-01 is answered on 80, and there is no
    # second process that can hold it — so anything already serving here moves
    # BEHIND Traefik rather than beside it. That is not a concession: production
    # runs one ingress, and this is the same shape the console and API use.
    #
    # A static route, in this file, because the control plane must never write a
    # route it did not derive from a live deployment. An incumbent site is not a
    # deployment and never will be.
    coexist:
      rule: Host(`{{env "NAVARCH_COEXIST_DOMAIN"}}`) || Host(`www.{{env "NAVARCH_COEXIST_DOMAIN"}}`)
      entryPoints:
        - websecure
      service: coexist
      tls:
        certResolver: le
{{end}}

{{if env "NAVARCH_WWW_REDIRECT"}}
  middlewares:
    navarch-www:
      redirectRegex:
        regex: "^https://www\\.(.*)"
        replacement: "https://${1}"
        permanent: true
{{end}}

  services:
    navarch-console:
      loadBalancer:
        servers:
          - url: http://console:8418
    navarch-api:
      loadBalancer:
        servers:
          - url: http://controlplane:8417
{{if env "NAVARCH_COEXIST_DOMAIN"}}
    coexist:
      loadBalancer:
        servers:
          # The incumbent, moved to a loopback port and speaking plain HTTP.
          # TLS terminates at Traefik now; terminating again behind it would be
          # two places to renew a certificate and two answers to "is this https".
          - url: http://{{env "NAVARCH_COEXIST_TARGET"}}
{{end}}
{{if env "NAVARCH_COEXIST_CERT"}}

# The incumbent's EXISTING certificate, served from the very first request.
#
# Without this there is a window — seconds, sometimes minutes — where Traefik
# holds 443 for a hostname it has not been issued a certificate for yet and
# answers with its self-signed default. For an ordinary site that is an ugly
# warning somebody clicks through. For one with HSTS preload it is a hard
# refusal in every browser, with no click-through and no plain-HTTP fallback,
# lasting until ACME finishes.
#
# So the cutover serves the certificate that already exists on disk, and ACME
# renews it on Traefik's own schedule afterwards. No gap, and nothing to undo.
tls:
  certificates:
    - certFile: {{env "NAVARCH_COEXIST_CERT"}}
      keyFile: {{env "NAVARCH_COEXIST_KEY"}}
{{end}}
