# Navarch's own marketing site, deployed by Navarch.
#
# The proof-of-concept the platform most needs to pass: if it cannot run a
# static site with a health check and an ingress, it cannot run anything. It is
# also the smallest honest end-to-end demo — one swappable service, no durable
# state, so a rollout is visible as a clean blue/green flip with nothing pinned
# to complicate it.
#
# The image is built and distributed by `make site-image`, never by the
# platform: `build:` is rejected at parse time, and pre-build-and-push is the
# contract that makes a deployed revision reproducible.
#
# It is named for the registry rather than locally, because this same file is
# what gets pushed to a real install — where the agent has to pull it from
# somewhere. `make site-image` builds and tags exactly this name, then streams
# it onto each dev node, and the agent pulls only when an image is absent, so
# the local demo never reaches the network. The `:1` is a content tag, bumped
# by hand when the site changes: `:latest` would never update here, since an
# image that is already present is never re-pulled.

services:
  web:
    image: ghcr.io/craigderington/navarch/site:1
    # swap is the whole point here. The site is stateless — it mounts nothing
    # and coordinates with nobody — so two copies during a rollout are not just
    # safe, they are how the traffic flip happens without downtime.
    x-composectl:
      rollout: swap
      ingress:
        port: 80
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
