# Runnable stack for the secret-injection demo. whoami echoes WHOAMI_NAME in
# its response body, so a value sourced from the encrypted store is visible
# end to end: POST the secret -> ciphertext at rest -> agent decrypts ->
# container env -> curl through Traefik shows the plaintext.

services:
  api:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: ${secret:name}
    x-composectl:
      rollout: swap
      ingress:
        port: 80
