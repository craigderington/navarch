# composectl local development stack.
# Ports are deliberately non-standard to avoid colliding with other
# projects already bound to the 3000/5000/8000/9000 ranges.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: composectl
      POSTGRES_PASSWORD: composectl
      POSTGRES_DB: composectl
    ports:
      # Loopback only: tenant containers must not hairpin to the control DB.
      - "127.0.0.1:5473:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U composectl -d composectl"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://composectl:composectl@postgres:5432/composectl?sslmode=disable"
      - "up"

  controlplane:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: controlplane
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      traefik-init:
        condition: service_completed_successfully
    environment:
      COMPOSECTL_DATABASE_URL: postgres://composectl:composectl@postgres:5432/composectl?sslmode=disable
      COMPOSECTL_LISTEN_ADDR: 0.0.0.0:8417
      COMPOSECTL_AGENT_TOKEN: dev-token-change-me
      COMPOSECTL_ROUTER_DIR: /dynamic
    volumes:
      - traefik-dynamic:/dynamic
    ports:
      # Loopback only: the shared dev token must not be reachable from fleets.
      - "127.0.0.1:8417:8417"
    healthcheck:
      test: ["CMD", "/composectl-controlplane", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # The control plane runs distroless-nonroot and can't write a root-owned fresh
  # volume; this one-shot makes /dynamic writable before it starts.
  traefik-init:
    image: busybox
    command: ["sh", "-c", "mkdir -p /dynamic && chown 65532:65532 /dynamic && chmod 700 /dynamic"]
    volumes:
      - traefik-dynamic:/dynamic

  # Traefik routes the env hostname to the live revision's ingress container.
  # It watches the file-provider dir the control plane writes, and the agent
  # attaches it to each revision network so it can reach that revision's
  # ingress container by name. The movement is deliberately one-way — the
  # router joins the tenant's network, the tenant never joins a shared one —
  # so two fleets have no network in common. The agent finds this container by
  # its cc.role label below.
  traefik:
    image: traefik:v3.3
    command:
      - "--entryPoints.web.address=:80"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      # No --api flag: Traefik v3 leaves the API and dashboard off unless one
      # is passed. There is no `--api.disabled`; passing it aborts startup with
      # "failed to decode configuration from flags: field not found, node:
      # disabled", and a Traefik that never starts looks exactly like a routing
      # bug from the demo's side.
    depends_on:
      controlplane:
        condition: service_healthy
    ports:
      # Loopback only. The dashboard/API is disabled; do not publish :8080.
      - "127.0.0.1:8095:80"
    labels:
      cc.role: ingress-router
    volumes:
      - traefik-dynamic:/dynamic:ro
    networks:
      - default

  # Node agent: reconciles the host Docker daemon to the control plane's desired
  # state. It creates sibling containers on the host daemon via the mounted
  # socket. The platform already rejects bind mounts, so there are no host-path
  # translation traps — only named volumes, which the host daemon owns.
  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: agent
    depends_on:
      controlplane:
        condition: service_healthy
    environment:
      COMPOSECTL_CONTROLPLANE_URL: http://controlplane:8417
      COMPOSECTL_ORG: dev
      COMPOSECTL_NODE_HOSTNAME: dev-node-1
      COMPOSECTL_AGENT_TOKEN: dev-token-change-me
      COMPOSECTL_AGE_IDENTITY_FILE: /identity/age.key
      COMPOSECTL_NODE_TOKEN_FILE: /identity/node.token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Identity must persist across restarts — a fresh keypair each boot
      # would make every existing secret's ciphertext undecryptable.
      - age-identity:/identity

volumes:
  pgdata:
  traefik-dynamic:
  age-identity:
