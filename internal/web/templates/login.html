{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Navarch</title>
<style>
  :root{--bg:#f6f7f8;--panel:#fff;--line:#dfe3e6;--fg:#12181d;--fg-2:#54626d;--fg-3:#8a97a1;
        --link:#12558a;--bad:#95231c;--bad-bg:#fbe6e4;
        --mono:ui-monospace,"SF Mono",Menlo,monospace;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1317;--panel:#161b21;--line:#252d35;--fg:#e6ebef;--fg-2:#9aa7b2;--fg-3:#6b7885;
    --link:#6cb6ff;--bad:#f08a80;--bad-bg:#2e1815}}
  :root[data-theme="dark"]{--bg:#0f1317;--panel:#161b21;--line:#252d35;--fg:#e6ebef;--fg-2:#9aa7b2;
    --fg-3:#6b7885;--link:#6cb6ff;--bad:#f08a80;--bad-bg:#2e1815}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;
       display:grid;place-items:center;min-height:100vh;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;width:100%;max-width:420px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:17px;margin-bottom:6px}
  p{color:var(--fg-2);font-size:13px;margin:0 0 20px;line-height:1.55}
  label{display:block;font-size:12px;color:var(--fg-3);margin-bottom:6px}
  input{width:100%;font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:5px;
        border:1px solid var(--line);background:var(--bg);color:var(--fg)}
  input:focus{outline:2px solid var(--link);outline-offset:1px}
  button{margin-top:14px;width:100%;font:inherit;font-weight:550;padding:10px;border-radius:5px;
         border:0;background:var(--link);color:#fff;cursor:pointer}
  .err{background:var(--bad-bg);color:var(--bad);border-left:3px solid var(--bad);
       padding:9px 12px;border-radius:4px;font-size:12.5px;margin-bottom:16px}
  .hint{margin:16px 0 0;font-size:12px;color:var(--fg-3)}
  code{font-family:var(--mono);font-size:11.5px}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5 21 7v10l-9 4.5L3 17V7l9-4.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      Navarch
    </div>
    <p>Sign in with an operator token. It stays on this server — your browser only receives a session cookie.</p>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label for="token">Operator token</label>
    <input id="token" name="token" type="password" autocomplete="off" autofocus
           spellcheck="false" placeholder="paste your token">
    <button type="submit">Sign in</button>
    <p class="hint">Don't have one? Ask an owner to run <code>navarch member add</code>, or create your own with <code>navarch token create</code>.</p>
  </form>
</body>
</html>{{end}}
